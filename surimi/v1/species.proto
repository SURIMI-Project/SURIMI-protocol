syntax = "proto3";

package surimi.v1;

import "surimi/v1/species_stage.proto";

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

message Species {
  string species_code = 1;
  string length_class = 2; // e.g. "Small", "Medium", "Large"
  string age = 3;
  SpeciesStage stage = 4;
}

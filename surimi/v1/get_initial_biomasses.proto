syntax = "proto3";

package surimi.v1;

import "buf/validate/validate.proto";
import "surimi/v1/species.proto";

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

// Requests the initial biomass for every species in a scenario.
message GetInitialBiomassesRequest {
  string scenario_name = 1 [(buf.validate.field).string = {min_len: 1}];
}

// The initial biomass of a species.
message InitialBiomass {
  Species species = 1;
  double biomass = 2;
}

// The initial biomasses for every species.
message InitialBiomassSummary {
  repeated InitialBiomass initial_biomasses = 1;
}

// The initial biomasses for every species in the requested scenario.
message GetInitialBiomassesResponse {
  InitialBiomassSummary initial_biomass_summary = 1;
}

syntax = "proto3";

package surimi.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

message SimulationStatus { // represents the status of a simulation as shown in the GUI
  string simulation_id = 1; // this simulation_id is generated by the client and should be unique for each simulation
  string scenario_id = 2; // current scenario that is simulated
  google.protobuf.Timestamp start_date_time = 3; // start date and time of the simulation
  google.protobuf.Timestamp end_date_time = 4; // end date and time of the simulation
  string status = 5; // status of the simulation. Initializing, t.b.d.
  google.protobuf.Timestamp simulation_created = 6; // date and time the simulation was created
  google.protobuf.Timestamp simulation_current = 7; // current date and time of the simulation
  string ecology_host = 8; // address of the ecology host that runs this simulation
}

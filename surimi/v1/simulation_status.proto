syntax = "proto3";

package surimi.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

// represents the status of a simulation as shown in the GUI
message SimulationStatus {
  // this simulation_id is generated by the client and should be unique for each simulation
  string simulation_id = 1;
  // the experiment_id that the simulation is part of
  string experiment_id = 2;
  // current scenario that is simulated
  string scenario_id = 3;
  // start date and time of the simulation
  google.protobuf.Timestamp start_date_time = 4;
  // end date and time of the simulation
  google.protobuf.Timestamp end_date_time = 5;
  // status of the simulation. Initializing, t.b.d.
  string status = 6;
  // date and time the simulation run was started
  google.protobuf.Timestamp simulation_started = 7;
  // duration of the simulation run
  google.protobuf.Duration simulation_duration = 8;
  // current date and time of the simulation
  google.protobuf.Timestamp simulation_current = 9;
  // address of the ecology host that runs this simulation
  string ecology_host = 10;
  // order of the simulation in the list of simulations
  int32 order = 11;
}

syntax = "proto3";

package surimi.v1;

import "surimi/v1/fishing_gear.proto";
import "surimi/v1/species.proto";

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

message DispositionGrid {
  Species species = 1;
  FishingGear fishing_gear = 2;
  string flag = 3; // 3 letter country code (ISO 3166-1 alpha-3)
  repeated DispositionCell disposition_cells = 4;
}

message DispositionCell {// center of the cell
  double longitude = 1;
  double latitude = 2;
  double gross_catch = 3; // every fish that is caught, before discarding
  double live_discards = 4; // live discards, e.g. fish that are thrown back alive
  double dead_discards = 5; // dead discards, e.g. fish that are thrown back dead
}

message CatchDispositionSummary {
  string measurement_unit = 1; // https://ucum.org/ucum
  repeated DispositionGrid disposition_grids = 2;
}

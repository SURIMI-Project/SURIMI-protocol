syntax = "proto3";

package surimi.v1;

import "surimi/v1/fleet_segment.proto";
import "surimi/v1/species.proto";
import "validate/validate.proto";

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

message DispositionGrid {
  Species species = 1;
  FleetSegment fleet_segment = 2;
  repeated DispositionCell disposition_cells = 3;
}

// center of the cell
message DispositionCell {
  double longitude = 1;
  double latitude = 2;
  // every fish that is caught, before discarding
  double gross_catch = 3 [(validate.rules).double = {gte: 0}];
  // live discards, e.g. fish that are thrown back alive
  double live_discards = 4 [(validate.rules).double = {gte: 0}];
  // dead discards, e.g. fish that are thrown back dead
  double dead_discards = 5 [(validate.rules).double = {gte: 0}];
}

message CatchDispositionSummary {
  repeated DispositionGrid disposition_grids = 1;
}

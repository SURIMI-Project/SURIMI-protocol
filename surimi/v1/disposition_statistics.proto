syntax = "proto3";

package surimi.v1;

import "surimi/v1/double_statistics.proto";
import "surimi/v1/fleet_segment.proto";
import "surimi/v1/species.proto";

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

message DispositionGridStatistics {
  Species species = 1;
  FleetSegment fleet_segment = 2;
  repeated DispositionCellStatistics disposition_cells_statistics = 3;
}

// center of the cell
message DispositionCellStatistics {
  double longitude = 1;
  double latitude = 2;
  // every fish that is caught, before discarding
  DoubleStatistics gross_catch = 3;
  // live discards, e.g. fish that are thrown back alive
  DoubleStatistics live_discards = 4;
  // dead discards, e.g. fish that are thrown back dead
  DoubleStatistics dead_discards = 5;
}

message CatchDispositionStatisticsSummary {
  repeated DispositionGridStatistics disposition_grids_statistics = 1;
}

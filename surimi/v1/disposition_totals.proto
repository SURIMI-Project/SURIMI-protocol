syntax = "proto3";

package surimi.v1;

import "buf/validate/validate.proto";
import "surimi/v1/fleet_segment.proto";
import "surimi/v1/species.proto";

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

message DispositionTotals {
  Species species = 1;
  FleetSegment fleet_segment = 2;
  // every fish that is caught, before discarding
  double gross_catch_total = 3 [(buf.validate.field).double = {gte: 0}];
  // live discards, e.g. fish that are thrown back alive
  double live_discards_total = 4 [(buf.validate.field).double = {gte: 0}];
  // dead discards, e.g. fish that are thrown back dead
  double dead_discards_total = 5 [(buf.validate.field).double = {gte: 0}];
}

message CatchDispositionTotalsSummary {
  repeated DispositionTotals disposition_totals = 1;
}

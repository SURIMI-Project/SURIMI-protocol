syntax = "proto3";

package surimi.v1;

import "google/protobuf/timestamp.proto";
import "surimi/v1/disposition.proto";

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

message GetCatchDispositionRequest {
  string simulation_id = 1;
  google.protobuf.Timestamp start_date_time = 2;
  google.protobuf.Timestamp end_date_time = 3;
}

message GetCatchDispositionResponse {
  string simulation_id = 1;
  google.protobuf.Timestamp start_date_time = 2;
  google.protobuf.Timestamp end_date_time = 3;
  CatchDispositionSummary catch_disposition_summary = 4;
}

message UpdateCatchDispositionRequest {
  string simulation_id = 1;
  // When filled, this simulation is part on an experiment consisting of many simulations. The Controller should fill the experiment_id
  string experiment_id = 2;
  google.protobuf.Timestamp start_date_time = 3;
  google.protobuf.Timestamp end_date_time = 4;
  CatchDispositionSummary catch_disposition_summary = 5;
}

message UpdateCatchDispositionResponse {
  string simulation_id = 1;
  google.protobuf.Timestamp start_date_time = 2;
  google.protobuf.Timestamp end_date_time = 3;
}

// The fishery service definition contains methods that have to do with fisheries. It contains methods to get And update catch dispositions. I.E the catches and discards.
service FisheryService {
  // This method is used to retrieve the catches and discards for a given simulation and time period.
  rpc GetCatchDisposition(GetCatchDispositionRequest) returns (GetCatchDispositionResponse);
  // This method is used to update the catches and discards for a given simulation.
  rpc UpdateCatchDisposition(UpdateCatchDispositionRequest) returns (UpdateCatchDispositionResponse);
}

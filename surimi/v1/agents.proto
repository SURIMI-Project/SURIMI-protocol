syntax = "proto3";

package surimi.v1;

import "google/protobuf/timestamp.proto";
import "surimi/v1/biomass.proto";
import "surimi/v1/sales.proto";

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

message GetSalesSummaryRequest {
  string simulation_id = 1;
  google.protobuf.Timestamp start_date_time = 2;
  google.protobuf.Timestamp end_date_time = 3;
}

message GetSalesSummaryResponse {
  repeated SalesSummary sales_summaries = 1;
}

message GetGrossCatchesRequest {
  string simulation_id = 1;
  google.protobuf.Timestamp start_date_time = 2;
  google.protobuf.Timestamp end_date_time = 3;
}

message GetGrossCatchesResponse {
  string measurement_unit = 1; // https://ucum.org/ucum
  repeated FleetBiomassGrids fleet_biomass_grids = 2;
}

message GetLiveDiscardsRequest {
  string simulation_id = 1;
  google.protobuf.Timestamp start_date_time = 2;
  google.protobuf.Timestamp end_date_time = 3;
}

message GetLiveDiscardsResponse {
  string measurement_unit = 1; // https://ucum.org/ucum
  repeated FleetBiomassGrids fleet_biomass_grids = 2;
}

message GetDeadDiscardsRequest {
  string simulation_id = 1;
  google.protobuf.Timestamp start_date_time = 2;
  google.protobuf.Timestamp end_date_time = 3;
}

message GetDeadDiscardsResponse {
  string measurement_unit = 1; // https://ucum.org/ucum
  repeated FleetBiomassGrids fleet_biomass_grids = 2;
}

service AgentsService {
  rpc GetSalesSummary(GetSalesSummaryRequest) returns (GetSalesSummaryResponse);
  rpc GetGrossCatches(GetGrossCatchesRequest) returns (GetGrossCatchesResponse);
  rpc GetLiveDiscards(GetLiveDiscardsRequest) returns (GetLiveDiscardsResponse);
  rpc GetDeadDiscards(GetDeadDiscardsRequest) returns (GetDeadDiscardsResponse);
}

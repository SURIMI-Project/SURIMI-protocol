syntax = "proto3";

package surimi.v1;

import "google/protobuf/timestamp.proto";
import "surimi/v1/fishing_activity.proto";
import "surimi/v1/regulation.proto";

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

//
message UpdateRegulationsRequest {
  string simulation_id = 1;
  google.protobuf.Timestamp start_date_time = 2;
  google.protobuf.Timestamp end_date_time = 3;
  RegulationsSummary regulations_summary = 4;
}

message UpdateRegulationsResponse {
  string simulation_id = 1;
  google.protobuf.Timestamp start_date_time = 2;
  google.protobuf.Timestamp end_date_time = 3;
}

message GetFishingActivityRequest {
  string simulation_id = 1;
  google.protobuf.Timestamp start_date_time = 2;
  google.protobuf.Timestamp end_date_time = 3;
}

message GetFishingActivityResponse {
  string simulation_id = 1;
  google.protobuf.Timestamp start_date_time = 2;
  google.protobuf.Timestamp end_date_time = 3;
  FishingActivitySummary fishing_activity_summary = 4;
}

// The regulations consumer service has to be implemented by services that consume fishing regulations. In turn they must provide their fishing activity
service RegulationsConsumerService {
  // This method is used to update the Harvest Control Regulations for the specified period.
  rpc UpdateRegulations(UpdateRegulationsRequest) returns (UpdateRegulationsResponse);
  // This method has to be implemented to provide the fishing activity
  rpc GetFishingActivity(GetFishingActivityRequest) returns (GetFishingActivityResponse);
}

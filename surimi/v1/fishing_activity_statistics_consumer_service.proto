syntax = "proto3";

package surimi.v1;

import "google/protobuf/timestamp.proto";
import "surimi/v1/fishing_activity_statistics.proto";

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

message UpdateFishingActivityStatisticsRequest {
  string experiment_id = 1;
  google.protobuf.Timestamp start_date_time = 2;
  google.protobuf.Timestamp end_date_time = 3;
  FishingActivityStatisticsSummary fishing_activity_statistics_summary = 4;
}

message UpdateFishingActivityStatisticsResponse {
  string experiment_id = 1;
}

// The regulations provider service has to be implemented by services that provide regulations, such as the fishery authority. In turn, it receives fishing activity to gather feedback of the regulations
service FishingActivityStatisticsConsumerService {
  // This method has to be implemented to receive the fishing activity needed to calculate the new regulations
  rpc UpdateFishingActivityStatistics(UpdateFishingActivityStatisticsRequest) returns (UpdateFishingActivityStatisticsResponse);
}

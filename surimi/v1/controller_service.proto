syntax = "proto3";

package surimi.v1;

import "google/protobuf/timestamp.proto";
import "surimi/v1/simulation_status.proto";

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

message InitialiseSimulationRequest {
  string scenario_id = 1;
  // this simulation_id is generated by the client and should be unique for each simulation
  string simulation_id = 2;
  // end date and time of the simulation
  google.protobuf.Timestamp end_date_time = 3;
}

message InitialiseSimulationResponse {
  string simulation_id = 1;
}

message RunSimulationRequest {
  string simulation_id = 1;
}

message RunSimulationResponse {
  string simulation_id = 1;
}

message CancelSimulationRequest {
  string simulation_id = 1;
}

message CancelSimulationResponse {
  string simulation_id = 1;
}

message GetAllSimulationStatusesRequest {}

message GetAllSimulationStatusesResponse {
  // list of all simulation statuses
  repeated SimulationStatus simulation_statuses = 1;
}

// The ControllerService is called to send commands to the simulation controller. For example by a GUI.
// Ít's also used to check the status of all simulations, so the GUI can display them.
service ControllerService {
  // Initialises a new simulation with the given scenario_id, a simulation_id and the requested end date and time.
  rpc InitialiseSimulation(InitialiseSimulationRequest) returns (InitialiseSimulationResponse);
  // Runs the simulation with the given simulation_id.
  rpc RunSimulation(RunSimulationRequest) returns (RunSimulationResponse);
  // Cancels the simulation with the given simulation_id.
  rpc CancelSimulation(CancelSimulationRequest) returns (CancelSimulationResponse);
  // Gets the statuses of all simulations. This method can be periodically called by a GUI to update the list of simulations and their statuses.
  rpc GetAllSimulationStatuses(GetAllSimulationStatusesRequest) returns (GetAllSimulationStatusesResponse);
}

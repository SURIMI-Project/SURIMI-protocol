syntax = "proto3";

package surimi.v1;

import "google/protobuf/timestamp.proto";
import "surimi/v1/regulation_definition.proto";
import "surimi/v1/simulation.proto";
import "surimi/v1/simulation_status.proto";

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

// This message is sent by the GUI to the controller to create a new experiment.
message SubmitExperimentRequest {
  string scenario_id = 1;
  // this experiment_id is generated by the client and should be unique for each experiment. It is used to link the experiment to the simulations that are run as part of this experiment.
  string experiment_id = 2;
  // end date and time of the experiment
  google.protobuf.Timestamp end_date_time = 3;
  // This is the number of simulations that is run as part of this experiment.
  int32 number_of_runs = 4;
  // A set of regulation definitions that are used in the experiments.
  RegulationDefinitionsSummary regulations_definitions_summary = 5;
}

// The answer to SubmitExperimentRequest.
message SubmitExperimentResponse {
  string experiment_id = 1;
}

message RemoveExperimentRequest {
  string experiment_id = 1;
}

message RemoveExperimentResponse {
  string experiment_id = 1;
}

// This message is send periodically to request the status of all experiments and simulations
message GetAllSimulationStatusesRequest {}

// The answer message containing the status of all experiments and simulations
message GetAllSimulationStatusesResponse {
  // list of all simulation statuses
  repeated SimulationStatus simulation_statuses = 1;
}

message GetSimulationContractRequest {}

message GetSimulationContractResponse {
  // the Simulation contract.
  Simulation simulation = 1;
}

// The ControllerService is called to send commands to the simulation controller. For example by a GUI.
// It's also used to check the status of all simulations, so the GUI can display them.
service ControllerService {
  // Submits a new experiment with the given scenario_id, an experiment_id and the requested end date and time.
  rpc SubmitExperiment(SubmitExperimentRequest) returns (SubmitExperimentResponse);
  // Removes the experiment with the given experiment_id.
  rpc RemoveExperiment(RemoveExperimentRequest) returns (RemoveExperimentResponse);
  // Gets the statuses of all simulations. This method can be periodically called by a GUI to update the list of simulations and their statuses.
  rpc GetAllSimulationStatuses(GetAllSimulationStatusesRequest) returns (GetAllSimulationStatusesResponse);
  // Gets the simulation contract. This method can be used by, for example, the GUI to get the simulation contract, so it can check which species codes, port codes, gear codes, etc. are used in the simulation.
  // This method reads the yaml file and returns the simulation contract.
  rpc GetSimulationContract(GetSimulationContractRequest) returns (GetSimulationContractResponse);
}

syntax = "proto3";

package surimi.v1;

import "google/protobuf/timestamp.proto";
import "surimi/v1/environment_variables.proto";

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

// Message that is sent to request the Environment Variables  at the moment of date_time
message GetEnvironmentVariablesRequest {
  // This simulation_id identifies the simulation this request belongs to
  string simulation_id = 1;
  // The moment the EnvironmentVariables is requested for
  google.protobuf.Timestamp date_time = 2;
}

// This message returns the Environment Variables at the moment of date_time
message GetEnvironmentVariablesResponse {
  // This simulation_id identifies the simulation this request belongs to
  string simulation_id = 1;
  // The moment that these Environment Variables appply to
  google.protobuf.Timestamp date_time = 2;
  // The EnvironmentVariables summary
  EnvironmentVariablesSummary environment_variables_summary = 3;
}

// This is an output message, containing the Environment Variables at the moment of date_time
message UpdateEnvironmentVariablesRequest {
  // This simulation_id identifies the simulation this request belongs to
  string simulation_id = 1;
  // The moment that this EnvironmentVariables is calculated for
  google.protobuf.Timestamp date_time = 2;
  // The EnvironmentVariables summary
  EnvironmentVariablesSummary environment_variables_summary = 3;
}

// The response message of UpdateEnvironmentVariablesRequest
message UpdateEnvironmentVariablesResponse {
  // This simulation_id identifies the simulation this request belongs to
  string simulation_id = 1;
}

// The Environment service definition contains methods that have to do with Environment. It contains methods to get and update EnvironmentVariables information
service EnvironmentService {
  // Get the EnvironmentVariables information for a simulation
  rpc GetEnvironmentVariables(GetEnvironmentVariablesRequest) returns (GetEnvironmentVariablesResponse);
  // Update the EnvironmentVariables information
  rpc UpdateEnvironmentVariables(UpdateEnvironmentVariablesRequest) returns (UpdateEnvironmentVariablesResponse);
}

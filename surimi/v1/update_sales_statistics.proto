syntax = "proto3";

package surimi.v1;

import "google/protobuf/timestamp.proto";
import "surimi/v1/sales_statistics.proto";

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

// This Message is sent to update the sales summary for a given experiment and time period. The sales are used to calculate the Species prices for the next time period.
message UpdateSalesStatisticsRequest {
  // This experiment_id identifies the experiment this request belongs to
  string experiment_id = 1;
  // The start of the time period for which the sales statistics summary is being updated
  google.protobuf.Timestamp start_date_time = 2;
  // The end of the time period for which the sales statistics summary is being updated
  google.protobuf.Timestamp end_date_time = 3;
  // The sales statistics summary to be updated
  SalesStatisticsSummary sales_statistics_summary = 4;
}

message UpdateSalesStatisticsResponse {
  // This experiment_id identifies the experiment this response belongs to
  string experiment_id = 1;
}

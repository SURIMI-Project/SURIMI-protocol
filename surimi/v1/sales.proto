syntax = "proto3";

package surimi.v1;

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

message SalesSummary {
  string market_id = 1;
  string currency = 2;
  string measurement_unit = 3;
  repeated Sale sales = 4;
}

message Sale {
  string category_code = 1;
  string species_code = 2;
  double quantity = 3;
  double value = 4;
}

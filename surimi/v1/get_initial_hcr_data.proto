syntax = "proto3";

package surimi.v1;

import "buf/validate/validate.proto";
import "surimi/v1/species.proto";

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

// Requests the initial harvest control rule data for every species in a scenario.
message GetInitialHCRDataRequest {
  string scenario_name = 1 [(buf.validate.field).string = {min_len: 1}];
}

// The initial harvest control rule data for a species.
message HCRData {
  Species species = 1;
  double initial_fishing_mortality_summary = 2;
  double initial_biomass_summary = 3;
}

// The initial harvest control rule data for the species in the requested scenario for which a HCR can be created.
message GetInitialHCRDataResponse {
  repeated HCRData hcr_data = 1;
}

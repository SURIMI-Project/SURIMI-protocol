syntax = "proto3";

package surimi.v1;

import "surimi/v1/currency.proto";
import "surimi/v1/fleet_segment.proto";
import "surimi/v1/market.proto";
import "surimi/v1/species.proto";

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

message Items {
  string biomass_unit = 1;
  repeated Market markets = 2;
  repeated Currency currencies = 3;
  repeated Species species = 4;
  repeated FleetSegment fleet_segments = 5;
}

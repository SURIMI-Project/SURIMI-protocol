syntax = "proto3";

package surimi.v1;

import "surimi/v1/stock_assesment.proto";

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

// Message that is sent to request the stock assesment (devided by species)
message GetStockAssesmentRequest {
  // This experiment_id identifies the experiment this request belongs to
  string experiment_id = 1;
}

// This message returns the stock assesment (devided by species)
message GetStockAssesmentResponse {
  // This experiment_id identifies the experiment this request belongs to
  string experiment_id = 1;
  // The stock assesment summary
  StockAssesmentSummary stock_assesment_summary = 3;
}

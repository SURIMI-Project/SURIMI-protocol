syntax = "proto3";

package surimi.v1;

import "surimi/v1/value_chain.proto";

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

// Message that is sent to request the value chain data (devided by year)
message GetValueChainRequest {
  // This experiment_id identifies the experiment this request belongs to
  string experiment_id = 1;
}

// This message returns the value chain data (devided by year)
message GetValueChainResponse {
  // This experiment_id identifies the experiment this request belongs to
  string experiment_id = 1;
  // The value chain summary
  ValueChainSummary value_chain_summary = 2;
}

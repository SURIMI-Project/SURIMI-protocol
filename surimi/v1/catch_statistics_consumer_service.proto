syntax = "proto3";

package surimi.v1;

import "google/protobuf/timestamp.proto";
import "surimi/v1/disposition_statistics.proto";

option csharp_namespace = "Grpc.Surimi";
option java_package = "eu.project.surimi";

// This message contains the catch statistics information for a given experiment and time period.
message UpdateCatchDispositionStatisticsRequest {
  string experiment_id = 1;
  google.protobuf.Timestamp start_date_time = 2;
  google.protobuf.Timestamp end_date_time = 3;
  CatchDispositionStatisticsSummary catch_disposition_statistics_summary = 4;
}

// The response message of UpdateCatchDispositionStatisticsRequest
message UpdateCatchDispositionStatisticsResponse {
  string experiment_id = 1;
}

// The catch statistics consumer service has to be implemented by a service that consumes catch statistics information.
service CatchStatisticsConsumerService {
  // This method is used to update the catch statistics for a given experiment.
  rpc UpdateCatchDispositionStatistics(UpdateCatchDispositionStatisticsRequest) returns (UpdateCatchDispositionStatisticsResponse);
}

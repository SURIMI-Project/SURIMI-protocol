name: Buf Lint and Breaking Check

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  buf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up buf CLI
        uses: bufbuild/buf-setup-action@v1

      - name: Lint .proto files
        run: buf lint

      - name: Check for breaking changes
        run: buf breaking --against 'https://github.com/nicolaspayette/surimi_protocol.git#branch=main'
